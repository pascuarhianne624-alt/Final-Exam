<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Game</title>
<style>
body{margin:0;font-family:Arial;background:#FFF0F5;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{color:#BE185D;}
#board{display:grid;grid-template-columns:repeat(3,90px);grid-template-rows:repeat(3,90px);gap:5px;background:#BE185D;padding:5px;border-radius:10px;}
.tile{width:90px;height:90px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;border-radius:8px;color:#BE185D;}
.tile.empty{background:transparent;}
button{margin-top:20px;padding:10px 20px;background:#BE185D;color:white;border:none;border-radius:20px;font-size:16px;}
#msg{margin-top:15px;font-weight:bold;color:#BE185D;}
</style>
</head>
<body>
<h1>🧩 Puzzle Game</h1>
<div id="board"></div>
<button onclick="shuffle()">Shuffle</button>
<div id="msg">Ayusin 1-8!</div>
<script>
let t=[1,2,3,4,5,6,7,8,0];let b=document.getElementById('board');let m=document.getElementById('msg');
function draw(){b.innerHTML='';t.forEach((n,i)=>{let d=document.createElement('div');d.className=n==0?'tile empty':'tile';d.textContent=n==0?'':n;d.onclick=()=>move(i);b.appendChild(d);});if(t.join(',')=='1,2,3,4,5,6,7,8,0')m.textContent='🎉 PANALO!';}
function move(i){let e=t.indexOf(0);let c=[e-3,e+3];if(e%3!=0)c.push(e-1);if(e%3!=2)c.push(e+1);if(c.includes(i)){[t[e],t[i]]=[t[i],t[e]];draw();}}
function shuffle(){for(let i=0;i<200;i++){let e=t.indexOf(0);let mv=[e-3,e+3];if(e%3!=0)mv.push(e-1);if(e%3!=2)mv.push(e+1);mv=mv.filter(x=>x>=0&&x<9);let r=mv[Math.floor(Math.random()*mv.length)];[t[e],t[r]]=[t[r],t[e]];}draw();}
draw();
</script>
</body>
</html>
